[project]
name = "ddm501-assignment2"
version = "1.0.0"
description = "Reproducible retail forecasting and MLOps coursework"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy", "pandas", "scikit-learn", "lightgbm==4.6.0", "mlflow", "matplotlib", "reportlab", "python-docx", "pymupdf"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
